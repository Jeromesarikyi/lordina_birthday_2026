<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday, my gorgeous wife</title>
<style>
@font-face{font-family:'Dancing Script';font-weight:600;font-display:swap;src:url(fonts/dancing-script-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Playfair Display';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/playfair-display-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Playfair Display';font-weight:500;font-style:italic;font-display:swap;src:url(fonts/playfair-display-latin-500-italic.woff2) format('woff2')}
:root{
  --bg:#2a1620; --bg2:#4a2233;
  --paper:#fbf6ee; --ink:#2b1d22; --muted:#8a7a7e; --rose:#c2185b; --line:#e3d8cc;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  padding:24px 16px;
  background:radial-gradient(ellipse at 50% 20%,var(--bg2),var(--bg) 70%);
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#f6e9ee;
}
.scene{width:min(92vw,520px);aspect-ratio:1008/1064;perspective:1600px}
.card{
  position:relative;width:100%;height:100%;border:0;padding:0;background:none;cursor:pointer;
  transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.7,.2,1);
}
.card.flipped{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;border-radius:18px;overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.5);
}
.front img{width:100%;height:100%;object-fit:cover;display:block}
.back{
  transform:rotateY(180deg);background:var(--paper);color:var(--ink);text-align:left;
  padding:clamp(18px,5vw,30px);display:flex;flex-direction:column;
  background-image:radial-gradient(#e9dfd2 1px,transparent 1px);background-size:22px 22px;
}
.head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--line);padding-bottom:12px}
.head b{display:block;font:600 clamp(1.3rem,5vw,1.9rem)/1 'Playfair Display',serif}
.head small{font-size:.7rem;letter-spacing:.16em;color:var(--muted);font-weight:500}
.stamp{
  width:64px;height:72px;border-radius:6px;background:linear-gradient(160deg,#f0522d,#f59b1b);
  color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:.62rem;font-weight:500;box-shadow:0 0 0 4px #fff,0 2px 8px rgba(0,0,0,.2);
  transform:rotate(3deg);flex:none;
}
.stamp span{font-size:1.5rem;line-height:1.1}
.msg{padding-top:clamp(10px,3vw,18px)}
.msg p{margin:0 0 .4em;font:600 clamp(1.15rem,5vw,1.6rem)/1.3 'Dancing Script','Segoe Script','Brush Script MT',cursive}
.sign{text-align:right;color:var(--rose);font-size:clamp(1.1rem,4.6vw,1.5rem)!important;margin:.3em 0 0!important}
.to{margin-top:auto;border-top:1px solid var(--line);padding-top:10px}
.to i{display:block;font:italic 500 clamp(1rem,4vw,1.2rem)/1.5 'Playfair Display',serif;border-bottom:1px solid var(--line)}
.to em{display:block;font-style:normal;color:var(--rose);font-size:.85rem;margin-top:8px}
.foot{display:flex;justify-content:space-between;margin-top:14px;font-size:.78rem;color:var(--muted)}
.foot i{font-family:'Playfair Display',serif}
.hint{font-size:.9rem;opacity:.75;margin:0}
.card:focus-visible{outline:3px solid #ffd1e1;outline-offset:6px;border-radius:20px}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="scene">
  <button class="card" id="card" aria-label="Birthday card. Press to flip it over." aria-pressed="false">
    <div class="face front">
      <img src="photo.jpg" alt="Happiest birthday to my gorgeous wife. No long paragraphs but I'm forever grateful for having you in my life.">
    </div>
    <div class="face back">
      <div class="head">
        <div><small>OFFICIAL KEEPSAKE</small><b>POST CARD</b></div>
        <div class="stamp" aria-hidden="true">👑<span>♥</span>FOREVER</div>
      </div>
      <div class="msg">
        <p>Happiest birthday to my gorgeous wife 😉❤️</p>
        <p>No long paragraphs but I’m forever grateful for having you in my life 🤗</p>
        <p class="sign">With all my love, forever yours,<br>Jerome ❤️</p>
      </div>
      <div class="to">
        <i>My Gorgeous Wife ❤️</i>
        <i>Queen of My Heart</i>
        <i>Forever &amp; Always</i>
        <em>★ Celebrating You Today</em>
      </div>
      <div class="foot"><i>Made with endless love &amp; gratitude</i><span>Tap to flip back ↺</span></div>
    </div>
  </button>
</div>
<p class="hint" id="hint">Tap the card to flip it</p>
<script>
const c=document.getElementById('card'),h=document.getElementById('hint');
c.addEventListener('click',()=>{
  const f=c.classList.toggle('flipped');
  c.setAttribute('aria-pressed',f);
  h.textContent=f?'Tap again to flip back':'Tap the card to flip it';
});
</script>
</body>
</html>
